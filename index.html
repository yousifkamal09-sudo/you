<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>منصة جغرافيا الخواطر - المحاكاة الفراغية</title>
    
    <!-- مكتبة A-Frame الأساسية للبعد الثالث والواقع المعزز -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <!-- إضافة ميزة الـ Hit-Test الرسمية لتعقب العمق والأبعاد -->
    <script src="https://unpkg.com/aframe-ar-hit-test-component@1.0.0/dist/aframe-ar-hit-test-component.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');
        
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Cairo', sans-serif;
            width: 100%;
            height: 100%;
            background-color: #000;
        }

        /* واجهة إرشادية للمستخدم فوق الكاميرا */
        #instruction-overlay {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(0, 0, 0, 0.75);
            color: #d4a373;
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: bold;
            border: 1px solid rgba(212, 163, 115, 0.5);
            text-align: center;
            pointer-events: none;
            width: 80%;
            max-width: 400px;
        }
    </style>
</head>
<body>

    <div id="instruction-overlay">وجه الكاميرا نحو الجدار وحرك الهاتف ببطء لتثبيت النص فراغياً...</div>

    <!-- تفعيل مشهد الـ AR مع ميزة الـ Hit-Test المخصصة للأسطح العمودية -->
    <a-scene 
      webxr="optionalFeatures: hit-test;" 
      ar-hit-test="target: #memory-holder; type: wall;"
      vr-mode-ui="enabled: false">
      
      <!-- حاوية الذاكرة: الكاميرا ستتحكم بموقعها لتلتصق بالجدار في الفضاء ثلاثي الأبعاد -->
      <a-entity id="memory-holder" position="0 0 -2">
        
        <!-- حلقة الإرشاد البصرية على الحائط -->
        <a-ring color="#d4a373" radius-inner="0.05" radius-outer="0.08" rotation="0 0 0"></a-ring>
        
        <!-- النص ثلاثي الأبعاد الحقيقي -->
        <!-- ملاحظة: الحجم ثابت هنا (scale)، والمحرك هو من سيصغره ويكبره تلقائياً حسب بعدك الفيزيائي عنه -->
        <a-text 
          id="dynamic-text"
          value="هنا تركتُ خاطرتي فوق جدار الزمن" 
          align="center" 
          color="#f5ebe0" 
          scale="2 2 2" 
          position="0 0 0.1"
          side="double">
        </a-text>

      </a-entity>

      <!-- كاميرا الواقع المعزز التي تحسب بُعدك الفيزيائي بالمتر -->
      <a-entity camera></a-entity>

    </a-scene>

    <script>
        const sceneEl = document.querySelector('a-scene');
        const overlay = document.getElementById('instruction-overlay');
        const memoryHolder = document.getElementById('memory-holder');

        // تحديث النص عند استقبال بيانات الـ URL إن وجدت
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const urlThought = urlParams.get('thought');
            const urlName = urlParams.get('author');
            const targetText = document.getElementById('dynamic-text');

            if (urlThought) {
                targetText.setAttribute('value', `${urlThought} \n [بقلم: ${urlName || 'مجهول'}]`);
            } else {
                // نص افتراضي مميز للتجربة الأدبية
                targetText.setAttribute('value', "هنا تركتُ خاطرتي فوق جدار الزمن \n [جغرافيا الخواطر]");
            }
        });

        // تغيير الإرشادات بناءً على وضعية الـ AR
        sceneEl.addEventListener('enter-vr', () => {
            if (sceneEl.is('ar-mode')) {
                overlay.innerText = "ابحث عن جدار.. عندما تلتصق الحلقة به، اضغط لتثبيت النص في هذا الحيز الفراغي!";
            }
        });

        // عند الضغط على الشاشة، يتم إيقاف تتبع الكاميرا المؤقت وتثبيت النص تماماً في تلك النقطة من الفضاء
        window.addEventListener('click', () => {
            if (sceneEl.is('ar-mode')) {
                // إزالة مكون الـ hit-test لكي يستقر النص في مكانه الجغرافي الحقيقي ولا يتحرك مجدداً مع حركة الكاميرا
                sceneEl.removeAttribute('ar-hit-test');
                overlay.innerText = "تم التثبيت الفراغي! تراجع للخلف ليصغر النص، واقترب منه ليكبر.";
                overlay.style.borderColor = "#00F5D4";
                overlay.style.color = "#00F5D4";
            }
        });
    </script>
</body>
</html>
