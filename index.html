<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>منصة جغرافيا الخواطر - البث المباشر (النسخة الأولى)</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght=400;700&display=swap');
        
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Cairo', sans-serif;
            width: 100%;
            height: 100%;
            background-color: #000;
        }

        /* الكاميرا الخلفية الحية */
        #webcam-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        /* اللوحة العائمة - تظهر عند الاقتراب لمسافة 10 أمتار أو أقل */
        #ar-overlay-card {
            position: fixed;
            top: 30%;
            left: 50%;
            transform: translate(-50%, -50%) scale(1);
            z-index: 5;
            background: rgba(30, 18, 11, 0.95);
            border: 2px solid #d4a373;
            border-radius: 15px;
            padding: 20px;
            width: 85%;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 15px 30px rgba(0,0,0,0.7);
            display: none; 
            color: #f5ebe0;
            transition: transform 0.3s ease-out, opacity 0.3s ease-out;
        }

        #ar-overlay-card p {
            font-size: 18px;
            line-height: 1.6;
            margin: 0 0 15px 0;
            word-wrap: break-word;
        }

        #ar-overlay-card .author {
            color: #e63946;
            font-weight: bold;
            font-size: 14px;
        }

        /* مؤشر تتبع المسافة المتبقية في الأعلى */
        #distance-radar {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(0, 0, 0, 0.7);
            color: #d4a373;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            border: 1px solid rgba(212, 163, 115, 0.4);
            display: none;
        }

        /* الأزرار العائمة أسفل الشاشة */
        .controls-container {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            width: 92%;
            max-width: 440px;
            display: flex;
            gap: 10px;
        }

        .action-btn {
            flex: 1;
            background: linear-gradient(135deg, #2c1d11 0%, #110a05 100%);
            color: #d4a373;
            border: 1px solid rgba(212, 163, 115, 0.6);
            padding: 14px 8px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            backdrop-filter: blur(5px);
            white-space: nowrap;
        }

        /* نافذة الغرز والأسئلة */
        .panel {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(18, 12, 8, 0.98);
            z-index: 100;
            display: none;
            flex-direction: column;
            color: #f5ebe0;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
        }

        .panel-header h2 {
            color: #d4a373;
            margin: 0 0 5px 0;
            font-size: 20px;
            text-align: center;
        }

        .input-group {
            margin-bottom: 12px;
            text-align: right;
